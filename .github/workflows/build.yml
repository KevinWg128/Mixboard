# Builds the APK on every push. Download it from the Actions run (Artifacts),
# or, on the main branch, from the Releases page on your phone.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk mixboard-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mixboard-apk
          path: mixboard-${{ github.run_number }}.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mixboard build ${{ github.run_number }}
          files: mixboard-${{ github.run_number }}.apk
